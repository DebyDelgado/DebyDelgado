name: YourTomo

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prsdx/YourTomo@main
        with:
          username: DebyDelgado
          timezone-offset-minutes: "-180"
          pet-name: "Chimo"
          accent-color: "#9b6b8e"
